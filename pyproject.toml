[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "talent-ranker"
version = "0.1.0"
description = "Auditable hybrid retrieval and reranking for candidate resumes"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35,<2",
  "cryptography>=43,<51",
  "fastapi>=0.115,<1",
  "google-api-python-client>=2.150,<3",
  "google-auth>=2.36,<3",
  "google-auth-oauthlib>=1.2,<2",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.6,<3",
  "pypdf>=5,<6",
  "psycopg[binary,pool]>=3.2,<4",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "requests>=2.31,<3",
  "urllib3>=2.2.3,<3",
  "transformers>=4.44,<5",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
agent = ["langchain>=1,<2", "langchain-openai>=1,<2"]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.8,<1"]

[tool.ruff.format]
line-ending = "lf"

[project.scripts]
talent-ranker = "talent_ranker.cli:main"
sieve-api = "sieve_app.server:main"
sieve-worker = "candidate_screening.worker:main"
sieve-index-worker = "sieve_app.indexing_worker:main"
sieve-drive-watch = "sieve_app.drive_watch_worker:main"
sieve-enrichment-worker = "sieve_app.enrichment_worker:main"
sieve-agent-ranking-worker = "sieve_app.agent_ranking_worker:main"

[tool.setuptools.packages.find]
where = ["src", "candidate-screening/src"]

[tool.pytest.ini_options]
pythonpath = ["src", "candidate-screening/src"]
testpaths = ["tests"]
markers = ["integration: requires a local PostgreSQL service"]

[tool.ruff]
line-length = 100
target-version = "py311"
