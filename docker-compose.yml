name: talent-ranker

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: talent_ranker
      POSTGRES_USER: talent_ranker
      POSTGRES_PASSWORD: talent-ranker-local-only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talent_ranker -d talent_ranker"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata: